# Comodidad local (docs/docker.md): build + mounts de datos ya cableados.
# No hay red, secretos ni servicios extra: es el mismo contenedor que
# `docker run`, con ./data montado en /app/data.

services:
  pipeline:
    build: .
    image: tfm-licitaciones:local
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    init: true
    volumes:
      - ./data:/app/data
    # Sin override ejecuta el smoke test del Dockerfile. Ejemplos:
    #   docker compose run --rm pipeline licitaciones-pipeline run \
    #     --raw-dir tests/fixtures/raw --output-root /tmp/fixture
    #   docker compose run --rm pipeline licitaciones-pipeline report
