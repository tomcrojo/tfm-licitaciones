[project]
name = "tfm-licitaciones"
version = "0.1.0"
description = "Pipeline DataOps reproducible para licitaciones públicas tecnológicas."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tomás Campoy Rojo" }]
license = { text = "MIT" }
dependencies = ["polars>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
licitaciones-pipeline = "tfm_licitaciones.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
